<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Frontline — Ближневосточный фронт (прототип)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1a; color: #eee; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; height: 100vh; width: 100vw; touch-action: none; }
    #ui { position: absolute; top: 0; left: 0; right: 0; z-index: 20; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { background: #2a2a2a; border: 1px solid #555; color: #eee; padding: 8px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    button.active { background: #3a5a8a; border-color: #6af; }
    #info { margin-left: auto; font-size: 13px; opacity: 0.85; }
    #map-container { position: absolute; inset: 0; overflow: hidden; background: #111; }
    #map { position: absolute; top: 0; left: 0; transform-origin: 0 0; user-select: none; }
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    #canvas-interact { pointer-events: auto; }
    .side-israel { color: #6af; }
    .side-coalition { color: #f86; }
  </style>
</head>
<body>
  <div id="ui">
    <button id="btn-israel" class="active">Израиль</button>
    <button id="btn-coalition">Коалиция</button>
    <button id="btn-add">+ Юнит</button>
    <button id="btn-reset">Сброс</button>
    <div id="info">Сторона: <span id="side-label" class="side-israel">Израиль</span> | Юнитов: <span id="unit-count">0</span></div>
  </div>
  <div id="map-container">
    <img id="map" src="map_base.jpg" alt="Map" draggable="false" />
    <canvas id="canvas-units"></canvas>
    <canvas id="canvas-interact"></canvas>
  </div>
  <script>
    let currentSide = "israel", units = [], selectedUnit = null, mapScale = 1, mapX = 0, mapY = 0, isDraggingMap = false;
    const mapImg = document.getElementById("map"), container = document.getElementById("map-container");
    const canvasUnits = document.getElementById("canvas-units"), canvasInteract = document.getElementById("canvas-interact");
    const ctxUnits = canvasUnits.getContext("2d");
    function resize() { const w = container.clientWidth, h = container.clientHeight; canvasUnits.width = w; canvasUnits.height = h; canvasInteract.width = w; canvasInteract.height = h; centerMap(); draw(); }
    function centerMap() { if (!mapImg.naturalWidth) return; const w = container.clientWidth, h = container.clientHeight; mapScale = Math.min(w / mapImg.naturalWidth, h / mapImg.naturalHeight) * 1.05; mapX = (w - mapImg.naturalWidth * mapScale) / 2; mapY = (h - mapImg.naturalHeight * mapScale) / 2; applyMapTransform(); }
    function applyMapTransform() { mapImg.style.transform = `translate(${mapX}px, ${mapY}px) scale(${mapScale})`; mapImg.style.transformOrigin = "0 0"; }
    mapImg.onload = () => resize(); window.addEventListener("resize", resize);
    document.getElementById("btn-israel").onclick = () => setSide("israel");
    document.getElementById("btn-coalition").onclick = () => setSide("coalition");
    document.getElementById("btn-add").onclick = addUnit;
    document.getElementById("btn-reset").onclick = () => { units = []; selectedUnit = null; updateInfo(); draw(); };
    function setSide(side) { currentSide = side; document.getElementById("btn-israel").classList.toggle("active", side === "israel"); document.getElementById("btn-coalition").classList.toggle("active", side === "coalition"); const label = document.getElementById("side-label"); label.textContent = side === "israel" ? "Израиль" : "Коалиция"; label.className = side === "israel" ? "side-israel" : "side-coalition"; }
    function updateInfo() { document.getElementById("unit-count").textContent = units.length; }
    function addUnit() { const cx = (container.clientWidth / 2 - mapX) / mapScale, cy = (container.clientHeight / 2 - mapY) / mapScale; units.push({ id: Date.now() + Math.random(), x: cx + (Math.random() - 0.5) * 80, y: cy + (Math.random() - 0.5) * 80, side: currentSide, size: 18 }); updateInfo(); draw(); }
    function draw() { ctxUnits.clearRect(0, 0, canvasUnits.width, canvasUnits.height); units.forEach(u => { const sx = u.x * mapScale + mapX, sy = u.y * mapScale + mapY, r = u.size * mapScale * 0.6; ctxUnits.beginPath(); ctxUnits.arc(sx, sy, r, 0, Math.PI * 2); ctxUnits.fillStyle = u.side === "israel" ? "#4a90e2" : "#e25c4a"; ctxUnits.fill(); ctxUnits.strokeStyle = selectedUnit === u ? "#fff" : "rgba(0,0,0,0.5)"; ctxUnits.lineWidth = selectedUnit === u ? 3 : 1.5; ctxUnits.stroke(); ctxUnits.beginPath(); ctxUnits.arc(sx, sy, 3, 0, Math.PI * 2); ctxUnits.fillStyle = "#fff"; ctxUnits.fill(); }); }
    function screenToMap(sx, sy) { return { x: (sx - mapX) / mapScale, y: (sy - mapY) / mapScale }; }
    function findUnitAt(sx, sy) { for (let i = units.length - 1; i >= 0; i--) { const u = units[i], usx = u.x * mapScale + mapX, usy = u.y * mapScale + mapY, r = u.size * mapScale * 0.7, dx = sx - usx, dy = sy - usy; if (dx * dx + dy * dy < r * r) return u; } return null; }
    let pointerDown = false, dragUnit = null, lastPointer = null;
    function onPointerDown(e) { e.preventDefault(); const rect = container.getBoundingClientRect(), sx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left, sy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top, u = findUnitAt(sx, sy); if (u) { selectedUnit = u; dragUnit = u; pointerDown = true; } else { selectedUnit = null; isDraggingMap = true; lastPointer = { x: sx, y: sy }; pointerDown = true; } draw(); }
    function onPointerMove(e) { if (!pointerDown) return; e.preventDefault(); const rect = container.getBoundingClientRect(), sx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left, sy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top; if (dragUnit) { const m = screenToMap(sx, sy); dragUnit.x = m.x; dragUnit.y = m.y; draw(); } else if (isDraggingMap && lastPointer) { mapX += sx - lastPointer.x; mapY += sy - lastPointer.y; lastPointer = { x: sx, y: sy }; applyMapTransform(); draw(); } }
    function onPointerUp() { pointerDown = false; dragUnit = null; isDraggingMap = false; lastPointer = null; }
    canvasInteract.addEventListener("mousedown", onPointerDown); window.addEventListener("mousemove", onPointerMove); window.addEventListener("mouseup", onPointerUp);
    canvasInteract.addEventListener("touchstart", onPointerDown, { passive: false }); window.addEventListener("touchmove", onPointerMove, { passive: false }); window.addEventListener("touchend", onPointerUp);
    container.addEventListener("wheel", (e) => { e.preventDefault(); const rect = container.getBoundingClientRect(), sx = e.clientX - rect.left, sy = e.clientY - rect.top, oldScale = mapScale, delta = e.deltaY > 0 ? 0.9 : 1.1; mapScale = Math.max(0.3, Math.min(3, mapScale * delta)); mapX = sx - (sx - mapX) * (mapScale / oldScale); mapY = sy - (sy - mapY) * (mapScale / oldScale); applyMapTransform(); draw(); }, { passive: false });
    updateInfo();
  </script>
</body>
</html>
